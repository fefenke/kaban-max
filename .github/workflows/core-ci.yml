name: Patched core fallback
on:
  push:
    branches: [main]
    paths: ['core/**', 'tests/core/**', 'scripts/build-core.sh', 'scripts/brand-core.py', '.github/workflows/core-ci.yml']
  pull_request:
    paths: ['core/**', 'tests/core/**', 'scripts/build-core.sh', 'scripts/brand-core.py', '.github/workflows/core-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fallback:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Fetch exact upstream and apply published changes
        run: |
          git init /tmp/kaban-core
          git -C /tmp/kaban-core fetch --depth=1 https://github.com/ushan0v/sing-box-forkop.git 60d96c99815a672712915a5c00114bf0f690ad80
          git -C /tmp/kaban-core checkout --detach FETCH_HEAD
          for patch in "$PWD"/core/patches/*.patch; do
            git -C /tmp/kaban-core apply --check "$patch"
            git -C /tmp/kaban-core apply "$patch"
          done
          python3 scripts/brand-core.py /tmp/kaban-core
      - name: Test TLS fingerprints, parsers and fallback including concurrent checks
        working-directory: /tmp/kaban-core
        run: go test -race -p=2 -tags=badlinkname,tfogo_checklinkname0,with_clash_api,with_utls,with_quic,with_wireguard,with_openvpn ./cmd/sing-box ./parser/... ./protocol/parser ./protocol/group ./common/tls ./common/tlsfragment
      - name: Test scoped automatic registry and restoration
        working-directory: /tmp/kaban-core
        run: |
          cp "$GITHUB_WORKSPACE/tests/core/auto_routing_test.go" common/autoroute/
          cp "$GITHUB_WORKSPACE/tests/core/auto_web_test.go" common/autoroute/
          cp "$GITHUB_WORKSPACE/tests/core/auto_registry_test.go" common/autoroute/
          cp "$GITHUB_WORKSPACE/tests/core/auto_repair_test.go" common/autoroute/
          cp "$GITHUB_WORKSPACE/tests/core/auto_ip_failure_test.go" common/autoroute/
          cp "$GITHUB_WORKSPACE/tests/core/auto_dial_isolation_test.go" common/autoroute/
          cp "$GITHUB_WORKSPACE/tests/core/auto_timeout_test.go" common/autoroute/
          cp "$GITHUB_WORKSPACE/tests/core/auto_storage_test.go" common/autoroute/
          cp "$GITHUB_WORKSPACE/tests/core/auto_scope_encoding_test.go" common/autoroute/
          cp "$GITHUB_WORKSPACE/tests/core/auto_manual_test.go" common/autoroute/
          cp "$GITHUB_WORKSPACE/tests/core/auto_original_context_test.go" common/autoroute/
          cp "$GITHUB_WORKSPACE/tests/core/auto_ip_registry_test.go" common/autoroute/
          cp "$GITHUB_WORKSPACE/tests/core/auto_dns_identity_test.go" route/
          cp "$GITHUB_WORKSPACE/tests/core/connections_snapshot_test.go" experimental/clashapi/
          cp "$GITHUB_WORKSPACE/tests/core/connection_log_policy_test.go" route/
          cp "$GITHUB_WORKSPACE/tests/core/runtime_log_levels_test.go" log/
          cp "$GITHUB_WORKSPACE/tests/core/fallback_partial_failure_test.go" protocol/group/
          cp "$GITHUB_WORKSPACE/tests/core/fallback_stream_failure_test.go" protocol/group/
          cp "$GITHUB_WORKSPACE/tests/core/fallback_probe_budget_test.go" protocol/group/
          cp "$GITHUB_WORKSPACE/tests/core/dns_log_policy_test.go" dns/
          cp "$GITHUB_WORKSPACE/tests/core/fakeip_ipv6_guard_test.go" common/autoroute/
          cp "$GITHUB_WORKSPACE/tests/core/fakeip_ipv6_migration_test.go" dns/transport/fakeip/
          cp "$GITHUB_WORKSPACE/tests/core/wan_state_test.go" "$GITHUB_WORKSPACE/tests/core/wan_probe_test.go" common/wanstate/
          cp "$GITHUB_WORKSPACE/tests/core/wan_log_gate_test.go" log/
          cp "$GITHUB_WORKSPACE/tests/core/lifecycle_log_test.go" log/
          cp "$GITHUB_WORKSPACE/tests/core/auto_decision_retention_test.go" common/autoroute/
          cp "$GITHUB_WORKSPACE/tests/core/auto_source_failure_test.go" common/autoroute/
          cp "$GITHUB_WORKSPACE/tests/core/auto_section_ip_test.go" common/autoroute/
          cp "$GITHUB_WORKSPACE/tests/core/auto_applied_diagnostics_test.go" common/autoroute/
          cp "$GITHUB_WORKSPACE/tests/core/auto_failed_retry_test.go" common/autoroute/
          cp "$GITHUB_WORKSPACE/tests/core/auto_probe_timeout_test.go" common/autoroute/
          cp "$GITHUB_WORKSPACE/tests/core/auto_protocol_risk_test.go" common/autoroute/
          cp "$GITHUB_WORKSPACE/tests/core/auto_late_dns_test.go" common/autoroute/
          cp "$GITHUB_WORKSPACE/tests/core/auto_all_ports_test.go" common/autoroute/
          go test -race -p=2 -tags=badlinkname,tfogo_checklinkname0,with_clash_api,with_utls,with_quic,with_wireguard,with_openvpn ./common/autoroute ./route ./dns ./dns/transport/fakeip ./common/wanstate ./log ./experimental/clashapi ./experimental/cachefile ./protocol/group
      - name: Test WARP profiles and network reset forwarding
        working-directory: /tmp/kaban-core
        run: |
          cp "$GITHUB_WORKSPACE/tests/core/warp_stability_test.go" protocol/warp/
          cp "$GITHUB_WORKSPACE/tests/core/warp_port_hint_test.go" protocol/warp/
          cp "$GITHUB_WORKSPACE/tests/core/warp_paths_api_test.go" experimental/clashapi/
          cp "$GITHUB_WORKSPACE/tests/core/warp_udp_recovery_test.go" transport/wireguard/
          go test -race -p=2 -tags=badlinkname,tfogo_checklinkname0,with_clash_api,with_utls,with_quic,with_wireguard,with_openvpn ./protocol/warp ./common/cloudflare ./transport/wireguard ./experimental/clashapi
      - name: Check error-first routing with the actual executable
        working-directory: /tmp/kaban-core
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables openssl
          mkdir -p /tmp/auto-fixtures
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=one.example.test -addext 'subjectAltName=DNS:one.example.test,DNS:two.example.test' -keyout /tmp/auto-fixtures/key.pem -out /tmp/auto-fixtures/cert.pem
          CGO_ENABLED=0 go build -trimpath -tags=badlinkname,tfogo_checklinkname0,with_clash_api,with_utls,with_quic,with_wireguard,with_openvpn -o /tmp/auto-core ./cmd/sing-box
          sudo unshare --net sh -c 'ip link set lo up; sysctl -w net.ipv4.tcp_syn_retries=1 >/dev/null; export KERNEL_TIMEOUT=1; exec python3 "$1" /tmp/auto-core /tmp/auto-fixtures system' sh "$GITHUB_WORKSPACE/tests/core/auto_error_binary.py"
          python3 "$GITHUB_WORKSPACE/tests/core/lifecycle_log_binary.py" /tmp/auto-core
          python3 "$GITHUB_WORKSPACE/tests/core/connection_actionable_binary.py" /tmp/auto-core
          python3 "$GITHUB_WORKSPACE/tests/core/fallback_partial_binary.py" /tmp/auto-core
